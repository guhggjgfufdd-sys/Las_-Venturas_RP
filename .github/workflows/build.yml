name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ الحل النهائي: تعديل الـ includes مباشرة
      # ============================================
      - name: Fix All Case Sensitivity Issues
        run: |
          echo "=== BEFORE FIX ==="
          ls -la *.h 2>/dev/null || echo "No .h in root"

          # 1) Copy vendor/raknet → vendor/RakNet (Android.mk uses RakNet)
          if [ -d "vendor/raknet" ] && [ ! -d "vendor/RakNet" ]; then
            cp -r vendor/raknet vendor/RakNet
            echo "✓ Copied vendor/raknet → vendor/RakNet"
          fi

          # 2) Fix ALL local #include "Something.h" to lowercase in .cpp and .h files
          # This only affects includes WITHOUT paths (e.g. "CheckFileHash.h" -> "checkfilehash.h")
          # Includes with paths like "../vendor/RakNet/..." are NOT affected
          find . -name "*.cpp" -o -name "*.h" | while read f; do
            # Skip vendor files (already correct)
            if echo "$f" | grep -q "vendor/"; then
              continue
            fi
            # Convert local includes to lowercase: #include "Something.h" -> #include "something.h"
            sed -i 's/#include "\([A-Za-z0-9_]*\.h\)"/#include "\L\1"/g' "$f"
          done
          echo "✓ Fixed all local #include cases"

          echo "=== VERIFY ==="
          grep -r '#include "' . --include="*.cpp" | grep -v vendor | head -20

      - name: Setup SAMP RakNet Engine
        run: |
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
