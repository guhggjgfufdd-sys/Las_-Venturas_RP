name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      - name: Fix All Build Issues
        run: |
          echo "=== 1) Fix vendor/RakNet ==="
          if [ -d "vendor/raknet" ] && [ ! -d "vendor/RakNet" ]; then
            cp -r vendor/raknet vendor/RakNet
            echo "✓ Copied vendor/raknet → vendor/RakNet"
          fi

          echo "=== 2) Fix typo ==="
          find . -name "*.cpp" -o -name "*.h" | while read f; do
            if echo "$f" | grep -q "vendor/"; then continue; fi
            sed -i 's/str_obfuscator_ns_template/str_obfuscator_no_template/g' "$f"
          done
          echo "✓ Fixed typo"

          echo "=== 3) Fix ALL #include cases in .cpp files ==="
          find . -name "*.cpp" | while read f; do
            if echo "$f" | grep -q "vendor/"; then continue; fi
            # Convert local includes: "Something.h" → "something.h"
            # This ONLY affects includes WITHOUT paths (no / in the filename)
            sed -i 's/#include "\([A-Za-z0-9_]*\.h\)"/#include "\L\1"/g' "$f"
            sed -i 's/#include "\([A-Za-z0-9_]*\.hpp\)"/#include "\L\1"/g' "$f"
          done
          echo "✓ Fixed all local #include cases"

          echo "=== VERIFY checkfilehash.cpp ==="
          grep '#include' checkfilehash.cpp || true

      - name: Fix Android.mk with Python
        run: |
          python3 << 'EOF'
          with open("Android.mk", "r") as f:
              content = f.read()

          includes = "LOCAL_C_INCLUDES := $(LOCAL_PATH) $(LOCAL_PATH)/game $(LOCAL_PATH)/game/RW $(LOCAL_PATH)/net $(LOCAL_PATH)/util $(LOCAL_PATH)/gui $(LOCAL_PATH)/vendor/RakNet $(LOCAL_PATH)/vendor/RakNet/SAMP $(LOCAL_PATH)/vendor/inih/cpp $(LOCAL_PATH)/vendor/imgui $(LOCAL_PATH)/vendor/hash\n"
          
          if "LOCAL_C_INCLUDES" not in content:
              content = content.replace("include $(BUILD_SHARED_LIBRARY)", includes + "include $(BUILD_SHARED_LIBRARY)")
              with open("Android.mk", "w") as f:
                  f.write(content)
              print("✓ Added LOCAL_C_INCLUDES")
          else:
              print("LOCAL_C_INCLUDES already exists")
          EOF

      - name: Setup SAMP RakNet Engine
        run: |
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
