name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ الحل الشامل: إصلاح جميع مشاكل Case Sensitivity
      # ============================================
      - name: Fix All Case Sensitivity Issues
        run: |
          echo "=== Fixing vendor/RakNet ==="
          if [ -d "vendor/raknet" ] && [ ! -e "vendor/RakNet" ]; then
            ln -s raknet vendor/RakNet
            echo "Created: vendor/RakNet -> vendor/raknet"
          fi

          echo "=== Creating CamelCase symlinks for all .h files ==="
          find . -name "*.h" -type f | while read f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            # Convert snake_case to CamelCase (e.g., checkfilehash.h -> CheckFileHash.h)
            camel=$(echo "$base" | sed -r 's/(^|_)([a-z])/\U\2/g')
            if [ "$base" != "$camel" ] && [ ! -e "$dir/$camel" ]; then
              (cd "$dir" && ln -s "$base" "$camel")
              echo "Created: $dir/$camel -> $base"
            fi
          done
          
          echo "=== Done ==="
          ls -la vendor/
          ls -la *.h 2>/dev/null || true

      - name: Setup SAMP RakNet Engine
        run: |
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
