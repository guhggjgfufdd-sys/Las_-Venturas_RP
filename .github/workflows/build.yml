name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      - name: Checkout Complete RakNet Source
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git clone --depth 1 https://github.com/OtxOpenSource/RakNet.git temp_samp || \
          git clone --depth 1 https://github.com/facebook/RakNet.git temp_samp

      - name: Setup RakNet Files
        run: |
          rm -rf vendor/RakNet
          mkdir -p vendor/RakNet
          if [ -d "temp_samp/vendor/RakNet" ]; then
            cp -r temp_samp/vendor/RakNet/* vendor/RakNet/
          elif [ -d "temp_samp/Source" ]; then
            cp -r temp_samp/Source/* vendor/RakNet/
          else
            cp -r temp_samp/* vendor/RakNet/
          fi
          rm -rf temp_samp

      - name: Install Android NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        uses: actions/upload-artifact@v4
        with:
          name: samp-compiled-libraries
          path: libs/
