name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ الحل النهائي: إصلاح جميع الأخطاء
      # ============================================
      - name: Fix All Build Issues
        run: |
          echo "=== 1) Fix vendor/RakNet ==="
          if [ -d "vendor/raknet" ] && [ ! -d "vendor/RakNet" ]; then
            cp -r vendor/raknet vendor/RakNet
            echo "✓ Copied vendor/raknet → vendor/RakNet"
          fi

          echo "=== 2) Fix typo: str_obfuscator_ns_template.hpp → str_obfuscator_no_template.hpp ==="
          find . -name "*.cpp" -o -name "*.h" | while read f; do
            if echo "$f" | grep -q "vendor/"; then continue; fi
            sed -i 's/str_obfuscator_ns_template/str_obfuscator_no_template/g' "$f"
          done
          echo "✓ Fixed typo in customserver.cpp"

          echo "=== 3) Fix Case Sensitivity in local #include ==="
          find . -name "*.cpp" -o -name "*.h" | while read f; do
            if echo "$f" | grep -q "vendor/"; then continue; fi
            # Convert #include "Something.h" → #include "something.h"
            sed -i 's/#include "\([A-Za-z0-9_]*\.h\)"/#include "\L\1"/g' "$f"
            # Convert #include "Something.hpp" → #include "something.hpp"
            sed -i 's/#include "\([A-Za-z0-9_]*\.hpp\)"/#include "\L\1"/g' "$f"
          done
          echo "✓ Fixed all local include cases"

          echo "=== VERIFY ==="
          grep -r 'str_obfuscator' . --include="*.cpp" | grep -v vendor | head -5
          grep -r '#include "' . --include="*.cpp" | grep -v vendor | head -10

      - name: Setup SAMP RakNet Engine
        run: |
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
