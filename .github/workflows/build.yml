name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ الحل النهائي: نسخ + تعديل Android.mk
      # ============================================
      - name: Fix All Case Sensitivity Issues
        run: |
          echo "=== BEFORE FIX ==="
          ls -la *.h 2>/dev/null || echo "No .h in root"
          ls -la vendor/ 2>/dev/null || echo "No vendor"

          # 1) Copy vendor/raknet → vendor/RakNet
          if [ -d "vendor/raknet" ] && [ ! -d "vendor/RakNet" ]; then
            cp -r vendor/raknet vendor/RakNet
            echo "✓ Copied vendor/raknet → vendor/RakNet"
          fi

          # 2) Copy all .h files with CamelCase names in root
          for f in *.h; do
            if [ -f "$f" ]; then
              # checkfilehash.h → Checkfilehash.h
              name="${f%.h}"
              camel=$(echo "$name" | sed -r 's/(^|_)([a-z])/\U\2/g')
              newname="${camel}.h"
              if [ "$f" != "$newname" ] && [ ! -f "$newname" ]; then
                cp "$f" "$newname"
                echo "✓ Copied $f → $newname"
              fi
            fi
          done

          # 3) Also fix subdirectories (game, net, gui, util)
          for dir in game net gui util; do
            if [ -d "$dir" ]; then
              for f in "$dir"/*.h; do
                if [ -f "$f" ]; then
                  name=$(basename "$f" .h)
                  camel=$(echo "$name" | sed -r 's/(^|_)([a-z])/\U\2/g')
                  newname="$dir/${camel}.h"
                  if [ "$f" != "$newname" ] && [ ! -f "$newname" ]; then
                    cp "$f" "$newname"
                    echo "✓ Copied $f → $newname"
                  fi
                fi
              done
            fi
          done

          echo "=== AFTER FIX ==="
          ls -la *.h 2>/dev/null || true
          ls -la vendor/ 2>/dev/null || true

      # ============================================
      # ⬇️ تعديل Android.mk ليضيف مسارات الـ headers
      # ============================================
      - name: Fix Android.mk Include Paths
        run: |
          # Add LOCAL_C_INCLUDES if not present
          if ! grep -q "LOCAL_C_INCLUDES" Android.mk; then
            sed -i '/include $(BUILD_SHARED_LIBRARY)/i \
          LOCAL_C_INCLUDES := $(LOCAL_PATH) $(LOCAL_PATH)/vendor/RakNet $(LOCAL_PATH)/vendor/raknet $(LOCAL_PATH)/game $(LOCAL_PATH)/net $(LOCAL_PATH)/gui $(LOCAL_PATH)/util' Android.mk
            echo "✓ Added LOCAL_C_INCLUDES to Android.mk"
          fi
          cat Android.mk

      - name: Setup SAMP RakNet Engine
        run: |
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
