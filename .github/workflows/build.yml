name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ الحل النهائي: نسخ الملفات بأسماء CamelCase
      # ============================================
      - name: Fix All Case Sensitivity Issues
        run: |
          python3 << 'EOF'
          import os
          import shutil

          # 1) Fix vendor/raknet → vendor/RakNet
          if os.path.isdir("vendor/raknet") and not os.path.exists("vendor/RakNet"):
              shutil.copytree("vendor/raknet", "vendor/RakNet")
              print("Copied: vendor/raknet → vendor/RakNet")

          # 2) Fix all .h files: snake_case → CamelCase
          for root, dirs, files in os.walk("."):
              # Skip .git and hidden dirs
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              for f in files:
                  if f.endswith(".h"):
                      # e.g. checkfilehash.h → Checkfilehash.h
                      # e.g. check_file_hash.h → CheckFileHash.h
                      name = f.replace(".h", "")
                      parts = name.split("_")
                      camel_name = "".join(p.capitalize() for p in parts) + ".h"
                      if f != camel_name:
                          src = os.path.join(root, f)
                          dst = os.path.join(root, camel_name)
                          if not os.path.exists(dst):
                              shutil.copy2(src, dst)
                              print(f"Copied: {src} → {dst}")

          print("=== Done ===")
          EOF

          echo "=== Verifying vendor/RakNet ==="
          ls -la vendor/ | grep -i raknet || true
          
          echo "=== Verifying root .h files ==="
          ls -la *.h 2>/dev/null || true

      - name: Setup SAMP RakNet Engine
        run: |
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
