name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      - name: Setup SAMP RakNet Source
        run: |
          if [ -f "vendor/RakNet/SAMP/samp_netencr.h" ]; then
            echo "SAMP RakNet file already exists in repository."
            exit 0
          fi

          echo "SAMP RakNet not found. Trying public sources..."

          URLS=(
            "https://github.com/SAMP-Android/RakNet.git"
            "https://github.com/katysheva/SAMP-Mobile.git"
            "https://github.com/Open-SAMP/RakNet.git"
            "https://github.com/vittorios/SAMP-Mobile.git"
          )

          CLONED=0
          for url in "${URLS[@]}"; do
            echo "Attempting to clone: $url"
            if GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone --depth 1 "$url" temp_samp 2>/dev/null; then
              echo "Successfully cloned from $url"
              CLONED=1
              break
            fi
          done

          if [ $CLONED -eq 0 ]; then
            echo "Error: Failed to fetch RakNet from available public sources."
            exit 1
          fi

          rm -rf vendor/RakNet
          mkdir -p vendor/RakNet

          if [ -d "temp_samp/vendor/RakNet" ]; then
            cp -r temp_samp/vendor/RakNet/* vendor/RakNet/
          elif [ -d "temp_samp/Source" ]; then
            cp -r temp_samp/Source/* vendor/RakNet/
          else
            cp -r temp_samp/* vendor/RakNet/
          fi

          rm -rf temp_samp

      - name: Install Android NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        uses: actions/upload-artifact@v4
        with:
          name: samp-compiled-libraries
          path: libs/
