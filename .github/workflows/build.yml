name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ الحل: إنشاء symlink لحل مشكلة Case Sensitivity
      # ============================================
      - name: Fix RakNet Case Sensitivity
        run: |
          if [ -d "vendor/raknet" ] && [ ! -d "vendor/RakNet" ]; then
            ln -s raknet vendor/RakNet
            echo "Created symlink: vendor/RakNet -> vendor/raknet"
          fi
          ls -la vendor/

      - name: Setup SAMP RakNet Engine
        run: |
          # ضع هنا أي أوامر إعداد RakNet Engine التي تستخدمها
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          # إذا كنت تستخدم NDK محدد
          # sudo apt-get update
          # sudo apt-get install -y android-ndk
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
