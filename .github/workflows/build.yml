name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup SAMP RakNet Source
        run: |
          # 1. التحقق إذا كانت ملفات RakNet موجودة بالفعل داخل المستودع
          if [ -f "vendor/RakNet/SAMP/samp_netencr.h" ]; then
            echo "SAMP RakNet already exists in repository."
            exit 0
          fi

          echo "Setting up RakNet files..."
          mkdir -p vendor/RakNet/SAMP

          # 2. جلب RakNet الأساسي
          if [ ! -f "vendor/RakNet/RakPeer.h" ]; then
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone --depth 1 https://github.com/facebookarchive/RakNet.git temp_samp || true
            if [ -d "temp_samp/Source" ]; then
              cp -r temp_samp/Source/* vendor/RakNet/
            elif [ -d "temp_samp" ]; then
              cp -r temp_samp/* vendor/RakNet/
            fi
            rm -rf temp_samp
          fi

          # 3. إنشاء ملف الهيدر الخاص بتشفير SAMP تلقائياً لتجنب خطأ Compilation
          if [ ! -f "vendor/RakNet/SAMP/samp_netencr.h" ]; then
            echo "Generating missing samp_netencr.h file..."
            cat << 'EOF' > vendor/RakNet/SAMP/samp_netencr.h
#ifndef SAMP_NETENCR_H
#define SAMP_NETENCR_H

#include "../RakNetTypes.h"

#ifdef __cplusplus
extern "C" {
#endif

void Log(const char *fmt, ...);
void samp_decrypt(unsigned char *buf, int len, int key);
void samp_encrypt(unsigned char *buf, int len, int key);

#ifdef __cplusplus
}
#endif

#endif
EOF
          fi

      - name: Install Android NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        uses: actions/upload-artifact@v4
        with:
          name: samp-compiled-libraries
          path: libs/
