name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      - name: Fix All Build Issues with Python
        run: |
          python3 << 'EOF'
          import os
          import shutil
          import re

          print("=== 1) Fix vendor/RakNet ===")
          if os.path.isdir("vendor/raknet") and not os.path.exists("vendor/RakNet"):
              shutil.copytree("vendor/raknet", "vendor/RakNet")
              print("✓ Copied vendor/raknet → vendor/RakNet")

          print("=== 2) Fix typo + Case Sensitivity in all .cpp/.h files ===")
          for root, dirs, files in os.walk("."):
              if "vendor" in root:
                  continue
              for f in files:
                  if f.endswith((".cpp", ".h")):
                      path = os.path.join(root, f)
                      try:
                          with open(path, "r", encoding="utf-8", errors="ignore") as file:
                              content = file.read()
                          
                          # Fix typo
                          content = content.replace("str_obfuscator_ns_template", "str_obfuscator_no_template")
                          
                          # Fix Case Sensitivity: #include "Something.h" → #include "something.h"
                          # This ONLY affects includes WITHOUT paths (no / in the filename)
                          def lower_include(match):
                              return '#include "' + match.group(1).lower() + '"'
                          
                          content = re.sub(r'#include "([A-Za-z0-9_]+\.h)"', lower_include, content)
                          content = re.sub(r'#include "([A-Za-z0-9_]+\.hpp)"', lower_include, content)
                          
                          with open(path, "w", encoding="utf-8", errors="ignore") as file:
                              file.write(content)
                          
                          print(f"✓ Fixed {path}")
                      except Exception as e:
                          print(f"⚠ Skipped {path}: {e}")

          print("=== 3) Copy ALL .h/.hpp with lowercase names ===")
          for root, dirs, files in os.walk("."):
              if "vendor" in root:
                  continue
              for f in files:
                  if f.endswith((".h", ".hpp")):
                      path = os.path.join(root, f)
                      lower = f.lower()
                      if f != lower:
                          dst = os.path.join(root, lower)
                          shutil.copy2(path, dst)
                          print(f"✓ Copied {f} → {lower} in {root}")

          print("=== VERIFY checkfilehash.cpp ===")
          try:
              with open("checkfilehash.cpp", "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()
                  for i, line in enumerate(lines[:5], 1):
                      print(f"  Line {i}: {line.strip()}")
          except:
              print("  Could not read checkfilehash.cpp")

          print("=== Done ===")
          EOF

      - name: Fix Android.mk with Python
        run: |
          python3 << 'EOF'
          with open("Android.mk", "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          includes = "LOCAL_C_INCLUDES := $(LOCAL_PATH) $(LOCAL_PATH)/game $(LOCAL_PATH)/game/RW $(LOCAL_PATH)/net $(LOCAL_PATH)/util $(LOCAL_PATH)/gui $(LOCAL_PATH)/vendor/RakNet $(LOCAL_PATH)/vendor/RakNet/SAMP $(LOCAL_PATH)/vendor/inih/cpp $(LOCAL_PATH)/vendor/imgui $(LOCAL_PATH)/vendor/hash\n"
          
          if "LOCAL_C_INCLUDES" not in content:
              content = content.replace("include $(BUILD_SHARED_LIBRARY)", includes + "include $(BUILD_SHARED_LIBRARY)")
              with open("Android.mk", "w", encoding="utf-8") as f:
                  f.write(content)
              print("✓ Added LOCAL_C_INCLUDES")
          else:
              print("LOCAL_C_INCLUDES already exists")
          EOF

      - name: Setup SAMP RakNet Engine
        run: |
          echo "Setup SAMP RakNet Engine..."

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK..."

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so-files
          path: |
            libs/**/*.so
            obj/**/*.so
