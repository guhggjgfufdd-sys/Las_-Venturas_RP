name: Build SAMP Native Engine

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      - name: Setup SAMP RakNet Source
        run: |
          if [ -f "vendor/RakNet/SAMP/samp_netencr.h" ]; then
            echo "SAMP RakNet already exists in repository."
          else
            echo "SAMP RakNet not found, downloading SAMP RakNet source..."
            git clone --depth 1 https://github.com/vittorios/RakNet.git temp_samp || \
            git clone --depth 1 https://github.com/unisamp/RakNet.git temp_samp || \
            git clone --depth 1 https://github.com/Bartek35/RakNet.git temp_samp
            
            rm -rf vendor/RakNet
            mkdir -p vendor/RakNet
            cp -r temp_samp/* vendor/RakNet/
            rm -rf temp_samp
          fi

      - name: Install Android NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Compile NDK Libraries
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload Compiled .so Files
        uses: actions/upload-artifact@v4
        with:
          name: samp-compiled-libraries
          path: libs/
